<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
    <marker id="head-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000080"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fff"/>

  <!-- Loop over the shared block -->
  <text x="320" y="44" text-anchor="middle" font-size="20" fill="#000080" font-weight="bold">z<tspan dy="6" font-size="13">t+1</tspan><tspan dy="-6"> = F</tspan><tspan dy="6" font-size="13">θ</tspan><tspan dy="-6">(z</tspan><tspan dy="6" font-size="13">t</tspan><tspan dy="-6">, x)</tspan></text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#555">repeat until z stops changing</text>
  <path d="M 365 150 C 365 82, 275 82, 275 146" fill="none" stroke="#000080" stroke-width="3" marker-end="url(#head-navy)"/>

  <!-- Patch embedding (raised Win98 box) -->
  <rect x="20" y="150" width="160" height="80" fill="#c0c0c0"/>
  <path d="M20 230 V150 H180" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M20 230 H180 V150" fill="none" stroke="#404040" stroke-width="3"/>
  <text x="100" y="186" text-anchor="middle" font-size="16">Image patches</text>
  <text x="100" y="208" text-anchor="middle" font-size="16">+ embedding</text>

  <line x1="184" y1="190" x2="234" y2="190" stroke="#000" stroke-width="2.5" marker-end="url(#head)"/>

  <!-- Shared, weight-tied block -->
  <rect x="240" y="150" width="160" height="80" fill="#000080"/>
  <path d="M240 230 V150 H400" fill="none" stroke="#1084d0" stroke-width="3"/>
  <path d="M240 230 H400 V150" fill="none" stroke="#000033" stroke-width="3"/>
  <text x="320" y="186" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">Shared ViT block</text>
  <text x="320" y="208" text-anchor="middle" font-size="14" fill="#dfe6ff">same weights every step</text>

  <line x1="404" y1="190" x2="454" y2="190" stroke="#000" stroke-width="2.5" marker-end="url(#head)"/>

  <!-- Classifier -->
  <rect x="460" y="150" width="160" height="80" fill="#c0c0c0"/>
  <path d="M460 230 V150 H620" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M460 230 H620 V150" fill="none" stroke="#404040" stroke-width="3"/>
  <text x="540" y="186" text-anchor="middle" font-size="16">Classifier</text>
  <text x="540" y="208" text-anchor="middle" font-size="14" fill="#333">on fixed point z*</text>

  <!-- Input injection -->
  <path d="M 100 234 V 292 H 320 V 238" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#head)"/>
  <text x="210" y="318" text-anchor="middle" font-size="14" fill="#555">input injection: x is fed to every step</text>
</svg>
