<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bankroll</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#082621">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;0,6..96,800;1,6..96,500&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Figtree:wght@400;500;600;700;800&family=Josefin+Sans:wght@300;600&family=Limelight&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1 class="brand">Bankroll</h1>
    <div class="iconbtns">
      <button class="iconbtn" id="boardBtn" data-act="openBoard" aria-label="Leaderboard" title="Leaderboard" hidden><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8.5 20h7M10 17h4"/></svg></button>
      <button class="iconbtn" data-act="history" aria-label="History" title="History"><svg viewBox="0 0 24 24"><path d="M4 19.5h16"/><path d="M5 16l4.5-5 3.5 3 6-7"/><circle cx="19" cy="7" r="1.2"/></svg></button>
      <button class="iconbtn" data-act="help" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.4"/><path d="M12 16.8v.2"/></svg></button>
      <button class="iconbtn" data-act="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button>
      <button class="iconbtn" data-act="restart" aria-label="New game" title="New game"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
    </div>
  </header>

  <section class="ledger" id="ledger" aria-label="Ledger"></section>
  <section class="levelbar" id="levelbar" aria-label="Level progress"></section>

  <section class="rail" aria-label="Card table">
    <div class="felt">
      <div class="pit" id="pit"></div>
      <div class="powers" id="powers"></div>
      <div>
        <div class="handhead" id="handhead"></div>
        <div class="hand" id="hand"></div>
      </div>
    </div>
  </section>

  <aside class="side">
    <section class="value" id="value" aria-label="Current hand value"></section>
    <div class="dock"><div class="dock-in" id="dock"></div></div>
  </aside>
</div>
<div id="sr" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="coach" class="coach" role="dialog" aria-label="Tutorial" hidden></div>
<div class="toast" id="toast" role="status"></div>
<div id="modalRoot"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="su-H" viewBox="0 0 100 100"><path fill="currentColor" d="M50 90C22 70 5 53 5 33 5 18 16 8 29 8c10 0 17 6 21 14 4-8 11-14 21-14 13 0 24 10 24 25 0 20-17 37-45 57z"/></symbol>
  <symbol id="su-D" viewBox="0 0 100 100"><path fill="currentColor" d="M50 3Q68 27 89 50 68 73 50 97 32 73 11 50 32 27 50 3z"/></symbol>
  <symbol id="su-S" viewBox="0 0 100 100"><path fill="currentColor" d="M50 4C60 22 93 38 93 61c0 14-10 22-21 22-8 0-14-4-18-9 1 9 5 16 13 22H33c8-6 12-13 13-22-4 5-10 9-18 9C17 83 7 75 7 61 7 38 40 22 50 4z"/></symbol>
  <symbol id="su-C" viewBox="0 0 100 100"><g fill="currentColor"><circle cx="50" cy="27" r="20"/><circle cx="26" cy="60" r="20"/><circle cx="74" cy="60" r="20"/><path d="M42 40h16v22H42z"/><path d="M47 58c0 16-4 28-14 38h34C57 86 53 74 53 58z"/></g></symbol>
  <symbol id="jk-star" viewBox="0 0 100 100"><path fill="currentColor" d="M50 5l12 31 33 2-26 21 9 32-28-18-28 18 9-32L5 38l33-2z"/></symbol>
</defs></svg>

<script src="https://unpkg.com/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="js/site-config.js"></script>
<script src="js/core.js"></script>
<script src="js/flow.js"></script>
<script src="js/sound.js"></script>
<script src="js/fx.js"></script>
<script src="js/render.js"></script>
<script src="js/history.js"></script>
<script src="js/settings.js"></script>
<script src="js/packs.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/input.js"></script>
<script src="js/telegram.js"></script>
<script src="js/main.js"></script>
</body>
</html>
